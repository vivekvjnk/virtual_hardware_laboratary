[project]
name = "ana-mcp-server"
version = "0.1.0"
description = "MCP Server for Virtual Hardware Laboratory"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn",
    "pydantic",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]
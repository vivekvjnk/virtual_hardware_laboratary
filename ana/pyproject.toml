[project]
name = "ana"
version = "0.1.0"
description = "ANA for Virtual Hardware Laboratory"
dependencies = [
    "pydantic",
    "mcp",
    "httpx",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["ana_agent*"]
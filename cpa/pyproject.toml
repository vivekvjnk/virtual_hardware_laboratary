[project]
name = "cpa"
version = "0.1.0"
description = "CPA for Virtual Hardware Laboratory"
dependencies = [
    "pydantic",
    "openhands-sdk",
    "openhands-tools",
    "vhl-protocol",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["component_placement_agent*"]

[tool.uv.sources]
vhl-protocol = { workspace = true }

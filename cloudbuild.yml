steps:
  # 1. Fetch the Backend branch using the Secret
  - name: 'gcr.io/cloud-builders/git'
    secretEnv: ['GITHUB_TOKEN']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        git clone --branch deployment/agent-backend \
        https://$$GITHUB_TOKEN@github.com/vivekvjnk/virtual_hardware_laboratary.git \
        ./backend-source

  # 2. Build the Runtime image (Primary)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vhl-runtime', '.']
    env:
      - 'DOCKER_BUILDKIT=1'

  # 3. Build the Backend Image (Sidecar)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vhl-agent-backend-sidecar', './backend-source']
  
  # 3.1 New Debug Step: List files inside the Backend image before pushing
  - name: 'gcr.io/cloud-builders/docker'
    args: ['run', 'gcr.io/$PROJECT_ID/vhl-agent-backend-sidecar', 'ls', '-R', '/app']
  
  # 4. Push both images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vhl-runtime']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vhl-agent-backend-sidecar']

  # 5. Deploy to Cloud Run as a Sidecar Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'beta'
      - 'run'
      - 'deploy'
      - 'unified-runtime-service'
      # Container 1: Runtime
      - '--container=vhl-runtime-container' 
      - '--image=gcr.io/$PROJECT_ID/vhl-runtime'
      - '--port=3020'
      - '--set-env-vars=VHL_AGENT_WS_URL=/ws-agent'
      
      # Container 2: Backend Sidecar
      - '--container=backend-container'
      - '--image=gcr.io/$PROJECT_ID/vhl-agent-backend-sidecar' # Matches Step 3
      - '--cpu=1'
      - '--memory=1Gi'   # <--- Increased memory to prevent OOM crashes
      - '--set-env-vars=VERTEXAI_PROJECT=$PROJECT_ID,VERTEXAI_LOCATION=us-central1'
      - '--set-env-vars=PYTHONUNBUFFERED=1,LOG_LEVEL=INFO,STORAGE_BACKEND=gcs,GCP_LOCATION=global' # Force logs out
      - '--set-env-vars=LLM_MODEL=vertex_ai/gemini-2.5-flash, GEMINI_2_5_FLASH=vertex_ai/gemini-2.5-flash'
      - '--set-env-vars=LLM_API_KEY=abc, LLM_REVIEW_MODEL=vertex_ai/gemini-3-flash-preview, GCS_BUCKET_NAME=vhl-storage,GCP_PROJECT=$PROJECT_ID'
      
      - '--region=europe-west1'

images:
  - 'gcr.io/$PROJECT_ID/vhl-runtime'
  - 'gcr.io/$PROJECT_ID/vhl-agent-backend-sidecar'

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/github-token/versions/latest
    env: 'GITHUB_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY
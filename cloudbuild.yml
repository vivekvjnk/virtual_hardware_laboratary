steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vhl-runtime', '.']
    env:
      - 'DOCKER_BUILDKIT=1'
  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vhl-runtime']

images:
  - 'gcr.io/$PROJECT_ID/vhl-runtime'
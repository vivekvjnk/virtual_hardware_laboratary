steps:
  # 1. Fetch the Backend branch using the Secret
  - name: 'gcr.io/cloud-builders/git'
    secretEnv: ['GITHUB_TOKEN']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        git clone --branch deployment/agent-backend \
        https://$$GITHUB_TOKEN@github.com/vivekvjnk/virtual_hardware_laboratary.git \
        ./backend-source

  # 2. Build the Runtime image (Primary)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vhl-runtime', '.']
    env:
      - 'DOCKER_BUILDKIT=1'

  # 3. Build the Backend Image (Sidecar)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vhl-agent-backend-sidecar', './backend-source']

  # 4. Push both images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vhl-runtime']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vhl-agent-backend-sidecar']

  # 5. Deploy to Cloud Run as a Sidecar Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'beta'
      - 'run'
      - 'deploy'
      - 'unified-runtime-service'
      - '--image=gcr.io/$PROJECT_ID/vhl-runtime' # Matches Step 2
      - '--container=backend-container'
      - '--image=gcr.io/$PROJECT_ID/vhl-agent-backend-sidecar' # Matches Step 3
      - '--region=europe-west1'
      - '--port=8080' # Ensure your Runtime Dockerfile EXPOSEs 8080

images:
  - 'gcr.io/$PROJECT_ID/vhl-runtime'
  - 'gcr.io/$PROJECT_ID/vhl-agent-backend-sidecar'

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/github-token/versions/latest
    env: 'GITHUB_TOKEN'
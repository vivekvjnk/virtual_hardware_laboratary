version: '3.8'

services:
  vhl-library:
    build: .
    container_name: vhl-library
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083" # Port for UI Snapshot MCP Server
      - "1080:1080" # Port for Agent WebSocket Server
      - "3020:3020" # Port for tscircuit
      # - "9000:9000" # port for Minio 
    networks:
      - vhl-network
    
    environment:
      - VHL_TRANSPORT=http
      - PORT=8080
      - VAP_PORT=8081
      - VHL_LIBRARY_DIR=/app/lib
      - SNAPSHOT_PORT=8083
      - MINIO_ENDPOINT=minio
     
      # Defaults to 'minio' locally
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-vhl-local-bucket}

    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: supersecretpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - vhl-network
    volumes:
      - .db/data:/data
    command: server --console-address ":9001" /data

networks:
  vhl-network:
    external: true

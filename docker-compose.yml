version: '3.8'

services:
  vhl-library:
    build: .
    container_name: vhl-library
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - vhl-network
    volumes:
      - vhl-lib:/app/lib
      - vhl-circuits:/app/circuits
    environment:
      - VHL_TRANSPORT=http
      - PORT=8080
      - VAP_PORT=8081
      - VHL_LIBRARY_DIR=/app/lib
      # Add your MinIO connection details here for your code to use
      - MINIO_ENDPOINT=minio
    restart: unless-stopped

networks:
  vhl-network:
    external: true

volumes:
  vhl-lib:
    driver: local
  vhl-circuits:
    driver: local
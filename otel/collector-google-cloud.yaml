# OTel Collector config — Google Cloud backend
# Routes traces to Google Cloud Trace using Application Default Credentials.
#
# Required:
#   - ADC credentials mounted (e.g. ~/.config/gcloud volume)
#   - GOOGLE_CLOUD_PROJECT env var set

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  # debug:
  #   verbosity: basic

  googlecloud:
    project: ${env:GOOGLE_CLOUD_PROJECT}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [googlecloud]
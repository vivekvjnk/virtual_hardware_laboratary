# OTel Collector config — Google Cloud backend
# Routes traces to Google Cloud Trace using Application Default Credentials.
#
# Required:
#   - ADC credentials mounted (e.g. ~/.config/gcloud volume)
#   - GOOGLE_CLOUD_PROJECT env var set

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  resourcedetection:
    detectors: [gcp]
    timeout: 2s

exporters:
  debug:
    verbosity: basic

  googlecloud:
    project: ${env:GOOGLE_CLOUD_PROJECT}
    log:
      default_log_name: "vhl-backend-logs"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [googlecloud,debug]
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [googlecloud]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [googlecloud]
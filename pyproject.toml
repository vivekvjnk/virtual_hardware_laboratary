[project]
name = "virtual-hardware-laboratary"
version = "0.1.0"
description = "Hardware laboratory for AI agents "
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.21",
    "google-cloud-aiplatform>=1.38",
    "openhands-sdk",
    "openhands-tools",
    "google-cloud-storage>=2.14.0",
    "python-dotenv>=1.2.1",
    "ana",
    "vhl-protocol",
    "vhl-workspace",
    "aosm",
    "archy",
    "librarian",
    "litellm",
    "traceloop-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
]

[tool.uv.workspace]
members = [
    "ana",
    "vhl_protocol",
    "workspace",
    "aosm",
    "archy",
    "librarian",
]

[tool.uv.sources]
litellm = { git = "https://github.com/vivekvjnk/litellm.git", branch = "fix/vertex-gemini-multimodal-drop" }
openhands-sdk = { git = "https://github.com/vivekvjnk/agent-sdk.git", branch = "main", subdirectory = "openhands-sdk" }
openhands-tools = { git = "https://github.com/vivekvjnk/agent-sdk.git", branch = "main", subdirectory = "openhands-tools" }

ana = { workspace = true }
vhl-protocol = { workspace = true }
vhl-workspace = { workspace = true }
aosm = { workspace = true }
archy = { workspace = true }
librarian = { workspace = true }

[tool.uv]
override-dependencies = [
    "litellm @ git+https://github.com/vivekvjnk/litellm.git@fix/vertex-gemini-multimodal-drop"
]
[project]
name = "aosm"
version = "0.1.0"
description = "VHL Agentic Orchestration State Machine"
dependencies = [
    "vhl-protocol",
    "vhl-workspace",
    "ana",
    "boto3",
    "librarian",
    "vhl-common",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["state_machine*"]

[project.scripts]
aosm = "state_machine.aosm:main"